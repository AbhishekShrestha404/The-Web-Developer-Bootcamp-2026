<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>

<body>
    <table border="1">
        <thead>
            <tr>
                <th rowspan="2">Rank</th>
                <th colspan="2">Average Mass</th>
                <th rowspan="2">Animal</th>
            </tr>
            <tr>
                <th>KG</th>
                <th>LB</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>104</td>
                <td>105</td>
                <td>Ostrich</td>
            </tr>
            <tr>
                <td>2</td>
                <td>50</td>
                <td>55</td>
                <td>Pigeon</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
